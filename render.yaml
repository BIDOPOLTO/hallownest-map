services:
  - type: web
    name: hallownest-map-federico
    runtime: static
    buildCommand: bash build-map.sh
    staticPublishPath: .
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
